name: Render LLS Smartcar PDF

on:
  push:
    paths:
      - "lls-smartcar/智能车培训与竞赛项目方案.html"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install WeasyPrint
        run: |
          python -m pip install --upgrade pip
          pip install weasyprint

      - name: Prepare reference images
        run: |
          mkdir -p "lls-smartcar/assets"
          curl -L --retry 3 --fail "https://img.yahboom.cn/images/store/PC/K210_shijue/pc%E7%AB%AF_52-min.jpg" -o "lls-smartcar/assets/car_k210.jpg"
          curl -L --retry 3 --fail "https://www.yahboom.com/public/upload/upload-html/1692864052/26.png" -o "lls-smartcar/assets/track.jpg"

      - name: Render PDF
        run: |
          weasyprint "lls-smartcar/智能车培训与竞赛项目方案.html" "lls-smartcar/智能车培训与竞赛项目方案.pdf"

      - name: Commit rendered PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "lls-smartcar/智能车培训与竞赛项目方案.pdf"
          if ! git diff --cached --quiet; then
            git commit -m "Render lls-smartcar project PDF"
            git push
          fi
